name: NemaraCaregiver

packages:
  Supabase:
    # Auth + Postgrest + Realtime + Storage SDK. We use the `Auth` and
    # `Realtime` products: Auth signs caregivers in; Realtime drives the
    # live roster / events updates so the app reflects backend state
    # without polling. SwiftPM resolves the latest 2.x.x at
    # `swift package update` time — pin floor to current latest so we
    # don't silently regress. Same pin as range so SwiftPM resolves a
    # single shared copy across both apps.
    url: https://github.com/supabase/supabase-swift
    from: "2.44.1"
  LiveKit:
    # LiveKit Cloud client SDK — used by the Live tab to subscribe to
    # the patient's `patient_<id>` room (Phase 1) and by Talk mode to
    # publish caregiver mic audio (Phase 3). Same major version as the
    # wall-phone (`nemara-camera-app`); pinned to 2.x so SwiftPM picks
    # the latest 2.y.z without breaking on a future 3.x rev.
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"

options:
  bundleIdPrefix: co.elephantlabs
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  NemaraCaregiver:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LiveKit
        product: LiveKit
    sources:
      - path: NemaraCaregiver
    resources:
      - path: NemaraCaregiver/Resources/Assets.xcassets
      # Fonts live under DesignSystem/ (they are a design token), but iOS
      # requires the .ttf files to be in the bundle root and listed in
      # UIAppFonts. xcodegen flattens folder-typed resources at the
      # bundle root, so UIAppFonts entries are bare filenames.
      - path: NemaraCaregiver/DesignSystem/Fonts
        type: folder
    info:
      path: NemaraCaregiver/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nemara
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: Colors/Paper
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
        # Allow plain HTTP to non-routable addresses (127.0.0.1, ::1,
        # 10.x, 192.168.x, fe80::/10, etc.) so the app can talk to a
        # local nemara-backend + Supabase stack during development.
        # Production hosts (HTTPS) are unaffected; ATS still enforces
        # TLS for routable destinations.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS 14+ requires this key (with a purpose string shown in the
        # one-time permission prompt) for an app to talk to RFC1918
        # private IPs like 10.0.0.x — the Mac's LAN address during dev.
        # Without it the OS silently blocks the connection and surfaces
        # it as "Internet connection appears to be offline" in the SDK.
        NSLocalNetworkUsageDescription: Nemara connects to your Mac's local nemara-backend during development. Allow to test on a physical device.
        # `nemara://` URL scheme reserved for future Supabase password-
        # reset deep links. Wired in MenoraApp pattern when real auth
        # ships — not handled in v0.
        CFBundleURLTypes:
          - CFBundleURLName: co.elephantlabs.nemara
            CFBundleURLSchemes:
              - nemara
        NSCameraUsageDescription: Nemara would use the camera to take a quick photo of the patient for their profile.
        NSPhotoLibraryUsageDescription: Nemara uses photos you pick to personalize the patient's profile.
        UIAppFonts:
          - Fraunces144Soft-Regular.ttf
          - Fraunces144Soft-Medium.ttf
          - Fraunces144Soft-SemiBold.ttf
          - Inter_18pt-Regular.ttf
          - Inter_18pt-Medium.ttf
          - Inter_18pt-SemiBold.ttf
          - Inter_18pt-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
    configFiles:
      Debug: NemaraCaregiver/Defaults.xcconfig
      Release: NemaraCaregiver/Defaults.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # System tint reads the same canonical token as the in-app
        # palette. Terra is the brand accent.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  NemaraCaregiverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NemaraCaregiverTests
    dependencies:
      - target: NemaraCaregiver
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: co.elephantlabs.nemara.caregiver.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        # The host app's PRODUCT_NAME is "Nemara" (set in Defaults.xcconfig),
        # not the target name "NemaraCaregiver". The test host has to point
        # at the actual .app bundle name on disk, otherwise xcodebuild
        # fails with "Could not find test host".
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nemara.app/Nemara"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NemaraCaregiver:
    build:
      targets:
        NemaraCaregiver: all
        NemaraCaregiverTests: [test]
    test:
      targets:
        - NemaraCaregiverTests
      gatherCoverageData: false
    run:
      config: Debug
      # The env vars below put the app on the live local stack out of
      # the box. AppConfig reads them via ProcessInfo at launch.
      #
      # The anon key here is the well-known LOCAL Supabase anon key —
      # generated deterministically from the local JWT secret
      # (`super-secret-jwt-token-with-at-least-32-characters-long`)
      # and identical across every developer's `supabase start`. Not
      # a real secret. Production keys come from the build environment.
      #
      # OS_ACTIVITY_MODE silences the simulator's verbose os_log
      # chatter (variant selector, RTIInputSystemClient, persona /
      # runningboard) without affecting our own logs.
      environmentVariables:
        OS_ACTIVITY_MODE: disable
        NEMARA_BACKEND_URL: http://127.0.0.1:8002
        SUPABASE_URL: http://127.0.0.1:54341
        SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    profile:
      config: Release
    archive:
      config: Release
